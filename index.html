<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PinTime — 약속을 대신 잡아주는 AI 비서</title>
    <meta
      name="description"
      content="PinTime으로 친구와 가능한 시간을 겹쳐 보고 약속을 잡아 보세요."
    />

    <!-- Open Graph / KakaoTalk / Slack 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PinTime" />
    <meta property="og:title" content="PinTime — 약속을 대신 잡아주는 AI 비서" />
    <meta
      property="og:description"
      content="친구와 가능한 시간을 겹쳐 보고 약속을 잡아 보세요."
    />
    <meta property="og:url" content="https://pintime.vercel.app/" />
    <meta property="og:image" content="https://pintime.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PinTime — 약속을 대신 잡아주는 AI 비서"
    />
    <meta
      name="twitter:description"
      content="친구와 가능한 시간을 겹쳐 보고 약속을 잡아 보세요."
    />
    <meta name="twitter:image" content="https://pintime.vercel.app/og.jpg" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#abe2c4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PinTime" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <script>
      try {
        var t = localStorage.getItem('pintime:theme')
        document.documentElement.dataset.theme =
          t === 'blue' || t === 'tomato' ? t : 'tomato'
      } catch (e) {
        document.documentElement.dataset.theme = 'tomato'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
