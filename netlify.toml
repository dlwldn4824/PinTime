# PinTime — Netlify static deploy
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Existing files in dist/ (pitch.html, pitch-export/, assets/) are served as-is.
# Everything else falls through to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
